<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7B0A0A">
    <meta name="description" content="Bank staff dashboard for customer accounts and transactions.">
    <title>Akash National Bank — Staff Dashboard</title>
    <!-- Using system fonts for modern Apple-like appearance; removed external font dependency -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar" role="banner">
        <div class="topbar-inner">
            <div class="topbar-brand">
                <img src="./assets/akash_logo.png" alt="Akash National Bank" class="brand-logo">
                <span class="brand-name">Akash National Bank</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="themeToggle" aria-label="Toggle dark/light mode">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="topbar-tricolor" aria-hidden="true">
            <span class="tc-saffron"></span>
            <span class="tc-white"></span>
            <span class="tc-green"></span>
        </div>
    </header>

    <main class="page" id="main-content">
        <section class="hero" aria-label="Page header">
            <div class="hero-inner">
                <h1 class="hero-title">Staff Dashboard</h1>
                <p class="hero-subtitle">Create accounts, credit, withdraw, and review recent transactions.</p>
            </div>
        </section>

        <nav class="dash-nav" aria-label="Banking operations">
            <button class="dash-nav-btn is-active" data-panel="create" type="button">Create New Account</button>
            <button class="dash-nav-btn" data-panel="credit" type="button">Credit</button>
            <button class="dash-nav-btn" data-panel="withdraw" type="button">Withdraw</button>
            <button class="dash-nav-btn" data-panel="history" type="button">History</button>
        </nav>

        <section class="card panel" id="panel-create" aria-labelledby="create-heading">
            <div class="card-header">
                <h2 class="card-title" id="create-heading">Create New Account</h2>
            </div>
            <div class="card-body">
                <form id="createForm" novalidate>
                    <div class="field">
                        <label class="field-label" for="accountNumber">Bank account number</label>
                        <input class="field-input" id="accountNumber" name="accountNumber" type="text"
                               placeholder="e.g. ACC-100001" required>
                        <span class="field-error" id="accountNumber-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="customerName">Customer name</label>
                        <input class="field-input" id="customerName" name="customerName" type="text"
                               placeholder="Full name" required>
                        <span class="field-error" id="customerName-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="phone">Phone number</label>
                        <input class="field-input" id="phone" name="phone" type="tel"
                               placeholder="10–15 digits" required>
                        <span class="field-error" id="phone-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="address">Address</label>
                        <textarea class="field-input field-textarea" id="address" name="address"
                                  placeholder="Customer address" rows="3" required></textarea>
                        <span class="field-error" id="address-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="initialBalance">Initial balance (₹)</label>
                        <input class="field-input" id="initialBalance" name="initialBalance" type="text"
                               inputmode="decimal" placeholder="0.00" required>
                        <span class="field-error" id="initialBalance-error" role="alert"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="createBtn">Create Account</button>
                    </div>
                </form>
                <div id="createMessage" class="toast" role="alert" aria-live="polite"></div>
                <div id="createdAccount" class="account-summary" hidden></div>
            </div>
        </section>

        <section class="card panel" id="panel-credit" hidden aria-labelledby="credit-heading">
            <div class="card-header">
                <h2 class="card-title" id="credit-heading">Credit Account</h2>
            </div>
            <div class="card-body">
                <form id="creditLookupForm" novalidate>
                    <div class="field">
                        <label class="field-label" for="creditAccountNumber">Account number</label>
                        <input class="field-input" id="creditAccountNumber" type="text" required>
                        <span class="field-error" id="creditAccountNumber-error" role="alert"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="creditLookupBtn">Find Account</button>
                    </div>
                </form>
                <div id="creditAccount" class="account-summary" hidden></div>
                <form id="creditForm" novalidate hidden>
                    <div class="field">
                        <label class="field-label" for="creditAmount">Credit amount (₹)</label>
                        <input class="field-input" id="creditAmount" type="text" inputmode="decimal" placeholder="0.00" required>
                        <span class="field-error" id="creditAmount-error" role="alert"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="creditBtn">Confirm Credit</button>
                    </div>
                </form>
                <div id="creditMessage" class="toast" role="alert" aria-live="polite"></div>
            </div>
        </section>

        <section class="card panel" id="panel-withdraw" hidden aria-labelledby="withdraw-heading">
            <div class="card-header">
                <h2 class="card-title" id="withdraw-heading">Withdraw</h2>
            </div>
            <div class="card-body">
                <form id="withdrawLookupForm" novalidate>
                    <div class="field">
                        <label class="field-label" for="withdrawAccountNumber">Account number</label>
                        <input class="field-input" id="withdrawAccountNumber" type="text" required>
                        <span class="field-error" id="withdrawAccountNumber-error" role="alert"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="withdrawLookupBtn">Find Account</button>
                    </div>
                </form>
                <div id="withdrawAccount" class="account-summary" hidden></div>
                <form id="withdrawForm" novalidate hidden>
                    <div class="field">
                        <label class="field-label" for="withdrawAmount">Withdrawal amount (₹)</label>
                        <input class="field-input" id="withdrawAmount" type="text" inputmode="decimal" placeholder="0.00" required>
                        <span class="field-error" id="withdrawAmount-error" role="alert"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="withdrawBtn">Review Withdrawal</button>
                    </div>
                </form>
                <div id="withdrawMessage" class="toast" role="alert" aria-live="polite"></div>
            </div>
        </section>

        <section class="card panel" id="panel-history" hidden aria-labelledby="history-heading">
            <div class="card-header">
                <h2 class="card-title" id="history-heading">Transaction History</h2>
            </div>
            <div class="card-body">
                <form id="historyForm" class="history-filter" novalidate>
                    <div class="field">
                        <label class="field-label" for="historyAccountNumber">
                            Account number <span class="field-label-hint">(optional)</span>
                        </label>
                        <input class="field-input" id="historyAccountNumber" type="text"
                               placeholder="Leave blank for recent activity">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="historyBtn">Load History</button>
                    </div>
                </form>
                <div id="historyMessage" class="toast" role="alert" aria-live="polite"></div>
                <div id="historyList" class="history-list"></div>
            </div>
        </section>
    </main>

    <dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
        <div class="dialog-inner">
            <div class="dialog-icon dialog-icon--warn" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <h3 class="dialog-title" id="dialog-title">Confirm withdrawal?</h3>
            <p class="dialog-desc" id="dialog-desc">This will deduct the amount from the customer account.</p>
            <div class="dialog-actions">
                <button class="btn btn-ghost" id="cancelAction" type="button">Cancel</button>
                <button class="btn btn-danger" id="confirmAction" type="button">Confirm Withdraw</button>
            </div>
        </div>
    </dialog>
    <div class="dialog-backdrop" id="dialogBackdrop" aria-hidden="true"></div>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
</body>
</html>
