<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B00">
    <meta name="description" content="Staff login for the banking management system.">
    <title>Banking System — Staff Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar" role="banner">
        <div class="topbar-inner">
            <div class="topbar-brand">
                <span class="brand-icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                </span>
                <span class="brand-name">Banking System</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="themeToggle" aria-label="Toggle dark/light mode">
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="topbar-tricolor" aria-hidden="true">
            <span class="tc-saffron"></span>
            <span class="tc-white"></span>
            <span class="tc-green"></span>
        </div>
    </header>

    <main class="login-page" id="main-content">
        <div class="login-card">
            <div class="login-brand" aria-hidden="true">
                <div class="login-brand-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                </div>
            </div>

            <h1 class="login-title">Staff Portal</h1>
            <p class="login-subtitle">Banking management system — authorized personnel only</p>

            <div class="auth-tabs" role="tablist" aria-label="Authentication options">
                <button class="auth-tab auth-tab--active" id="tab-signin" role="tab"
                        aria-selected="true" aria-controls="panel-signin">
                    Sign In
                </button>
                <button class="auth-tab" id="tab-signup" role="tab"
                        aria-selected="false" aria-controls="panel-signup">
                    Create Staff Login
                </button>
            </div>

            <div id="panel-signin" class="auth-panel" role="tabpanel" aria-labelledby="tab-signin">
                <form id="loginForm" class="login-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="loginUsername">Username</label>
                        <input class="field-input" id="loginUsername" name="username" type="text"
                               placeholder="Staff username" autocomplete="username" required autofocus>
                        <span class="field-error" id="login-username-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="loginPassword">Password</label>
                        <div class="password-wrap">
                            <input class="field-input" id="loginPassword" name="password" type="password"
                                   placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="pwd-eye-btn" id="loginPasswordToggle"
                                    aria-label="Show password" aria-pressed="false">
                                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="login-password-error" role="alert"></span>
                    </div>
                    <div id="loginError" class="login-error" role="alert" aria-live="polite" hidden></div>
                    <button type="submit" class="btn btn-primary login-submit" id="loginBtn">Sign In</button>
                </form>
            </div>

            <div id="panel-signup" class="auth-panel auth-panel--hidden" role="tabpanel" aria-labelledby="tab-signup">
                <form id="registerForm" class="login-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="regUsername">Username</label>
                        <input class="field-input" id="regUsername" name="username" type="text"
                               placeholder="Choose a staff username" autocomplete="username" required>
                        <span class="field-hint">At least 3 characters.</span>
                        <span class="field-error" id="reg-username-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="regPassword">Password</label>
                        <div class="password-wrap">
                            <input class="field-input" id="regPassword" name="password" type="password"
                                   placeholder="Create a password" autocomplete="new-password" required>
                            <button type="button" class="pwd-eye-btn" id="regPasswordToggle"
                                    aria-label="Show password" aria-pressed="false">
                                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.5 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-hint">At least 6 characters.</span>
                        <span class="field-error" id="reg-password-error" role="alert"></span>
                    </div>
                    <div class="field">
                        <label class="field-label" for="regConfirm">Confirm Password</label>
                        <div class="password-wrap">
                            <input class="field-input" id="regConfirm" name="confirm" type="password"
                                   placeholder="Repeat your password" autocomplete="new-password" required>
                            <button type="button" class="pwd-eye-btn" id="regConfirmToggle"
                                    aria-label="Show password" aria-pressed="false">
                                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.5 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="reg-confirm-error" role="alert"></span>
                    </div>
                    <div id="registerError" class="login-error" role="alert" aria-live="polite" hidden></div>
                    <div id="registerSuccess" class="login-success" role="status" aria-live="polite" hidden></div>
                    <button type="submit" class="btn btn-primary login-submit" id="registerBtn">Create Staff Login</button>
                </form>
            </div>
        </div>
    </main>

    <script src="./config.js"></script>
    <script src="./login.js"></script>
</body>
</html>
