services:
  - type: web
    name: banking-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: banking-system-db
          property: connectionString
      - key: BANK_STAFF_USERNAME
        sync: false
      - key: BANK_STAFF_PASSWORD
        sync: false
      - key: FRONTEND_DIR
        value: /app/frontend

databases:
  - name: banking-system-db
    plan: free
    databaseName: banking_system
    user: banking
